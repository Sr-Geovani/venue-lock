services:
  venuelock:
    build: ./server
    container_name: venuelock
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      - proxy
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    name: ${PROXY_NETWORK:-deploy_default}
    external: true
